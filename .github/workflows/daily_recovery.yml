name: MLB Daily Recovery Guard
# Manual recovery trigger: 2026-10-03 rebuild Best Card after frozen checksum repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_recovery.yml"
  # Temporarily suspend noisy scheduled recovery runs while the postseason\n  # date/freshness mismatch is repaired. Manual dispatch remains available.\n  workflow_dispatch:

concurrency:
  group: mlb-daily-recovery
  cancel-in-progress: false

jobs:
  refresh-current-slate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check for official MLB games before installing dependencies
        id: early_slate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/New_York'))
          day = (now.date() + timedelta(days=1) if now.hour >= 18 else now.date()).isoformat()
          try:
              with urlopen(f'https://statsapi.mlb.com/api/v1/schedule?sportId=1&date={day}', timeout=15) as response:
                  count = sum(len(x.get('games', [])) for x in json.load(response).get('dates', []))
          except Exception as exc:
              print(f'Schedule unavailable; preserve normal checks: {exc}')
              count = -1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'no_games={str(count == 0).lower()}\n')
          print(f'{day}: {count} scheduled MLB games')
          PY

      - name: Setup Python
        if: steps.early_slate.outputs.no_games != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all model dependencies
        if: steps.early_slate.outputs.no_games != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_player_props.txt -r requirements_best_card.txt

      - name: Check current slate freshness
        if: steps.early_slate.outputs.no_games != 'true'
        id: freshness
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          import gspread
          from google.oauth2.service_account import Credentials

          now = datetime.now(ZoneInfo("America/New_York"))
          expected = now.date() + timedelta(days=1) if now.hour >= 18 else now.date()
          expected_text = expected.isoformat()

          # A scheduled off-day is healthy. Check the official MLB schedule before
          # treating stale summary tabs as a recovery failure. If the schedule API
          # is unavailable, fail open to the normal recovery path rather than
          # incorrectly suppressing a real slate.
          no_games = False
          try:
              schedule_url = (
                  "https://statsapi.mlb.com/api/v1/schedule"
                  f"?sportId=1&date={expected_text}"
              )
              with urlopen(schedule_url, timeout=15) as response:
                  schedule = json.load(response)
              game_count = sum(
                  len(day.get("games", [])) for day in schedule.get("dates", [])
              )
              no_games = game_count == 0
              print(f"Official MLB games for {expected_text}: {game_count}")
          except Exception as exc:
              print(f"MLB schedule check unavailable; continuing recovery checks: {exc}")

          # On a confirmed MLB off-day, exit before touching Google Sheets.
          # This makes the guard a clean successful no-op and prevents stale-sheet
          # checks or credential/API issues from generating false failure alerts.
          if no_games:
              print(f"MLB off-day confirmed for {expected_text}; recovery guard exiting successfully.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("current=true\n")
                  output.write("no_games=true\n")
              raise SystemExit(0)
          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets",
                  "https://www.googleapis.com/auth/drive",
              ],
          )
          workbook = gspread.authorize(credentials).open_by_key(
              "1SsjWyqMsEW9yghahhuHCjDDtqlW2-56SbUWwmMXdig8"
          )
          tabs = [
              "Email Summary",
              "Game Email Summary",
              "Player Props Email Summary",
              "Best Card Email Summary",
          ]
          found = {}
          for tab in tabs:
              values = workbook.worksheet(tab).get("A1:B15")
              summary = {
                  row[0]: row[1] if len(row) > 1 else ""
                  for row in values
                  if row and row[0]
              }
              found[tab] = summary.get("Schedule Date Used", "")
          dates_current = all(value == expected_text for value in found.values())

          def records(tab):
              values = workbook.worksheet(tab).get_all_values()
              if not values:
                  return []
              headers = values[0]
              return [
                  {headers[i]: (row[i] if i < len(row) else "") for i in range(len(headers))}
                  for row in values[1:] if any(str(cell).strip() for cell in row)
              ]

          game_rows = records("Game Picks")
          hr_rows = records("Model Results")
          prop_rows = records("Player Props")

          def game_pks(rows, date_field="Date"):
              result = set()
              for row in rows:
                  if str(row.get(date_field, ""))[:10] != expected_text:
                      continue
                  raw = str(row.get("GamePk", "")).strip()
                  if raw:
                      result.add(raw)
              return result

          game_coverage = game_pks(game_rows)
          hr_coverage = game_pks(hr_rows)
          prop_coverage = game_pks(prop_rows)
          required_stack_games = min(3, game_count)
          # Game Picks intentionally excludes official games that are no longer
          # pregame-playable (for example a game already in progress when a late
          # recovery runs). The card requirement remains three unique games.
          coverage_current = (
              len(game_coverage) >= required_stack_games
              and len(hr_coverage) >= required_stack_games
              and len(prop_coverage) >= required_stack_games
          )
          current = dates_current and coverage_current
          print(f"Expected slate: {expected_text}")
          print(f"Summary dates: {found}")
          print(
              f"Coverage: games={len(game_coverage)}/{game_count}, "
              f"HR games={len(hr_coverage)}, prop games={len(prop_coverage)}, "
              f"required stack games={required_stack_games}"
          )
          print(f"All model sheets complete and current: {current}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"current={'true' if current else 'false'}\n")
              output.write(f"no_games={'true' if no_games else 'false'}\n")
          PY

      - name: Verify production safeguards
        if: steps.early_slate.outputs.no_games != 'true' && steps.freshness.outputs.no_games == 'false' && steps.freshness.outputs.current != 'true'
        run: python -m unittest discover -s tests -v

      - name: Refresh stale MLB slate sequentially with retries
        if: steps.early_slate.outputs.no_games != 'true' && steps.freshness.outputs.no_games == 'false' && steps.freshness.outputs.current != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -uo pipefail

          run_with_retry() {
            local label="$1"
            shift
            local attempt
            local status
            for attempt in 1 2 3; do
              echo "::group::${label} (attempt ${attempt}/3)"
              "$@"
              status=$?
              echo "::endgroup::"
              if [ "${status}" -eq 0 ]; then
                echo "${label} completed."
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                delay=$((attempt * 30))
                echo "${label} failed with status ${status}; retrying in ${delay}s."
                sleep "${delay}"
              fi
            done
            echo "::error::${label} failed after 3 attempts."
            return 1
          }

          failures=0
          run_with_retry "HR picks" python run_daily_mlb_hr_picks.py || failures=1
          run_with_retry "Game picks" python run_daily_mlb_game_picks.py || failures=1
          run_with_retry "Player props" python run_daily_mlb_player_props.py || failures=1
          run_with_retry "Best card" python run_daily_mlb_best_card.py || failures=1
          if [ "${failures}" -ne 0 ]; then
            echo "::error::One or more MLB refreshes failed."
            exit 1
          fi

      - name: Verify all four refreshed summaries
        if: steps.early_slate.outputs.no_games != 'true' && steps.freshness.outputs.no_games == 'false' && steps.freshness.outputs.current != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          import gspread
          from google.oauth2.service_account import Credentials

          now = datetime.now(ZoneInfo("America/New_York"))
          expected = now.date() + timedelta(days=1) if now.hour >= 18 else now.date()
          expected_text = expected.isoformat()
          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets",
                  "https://www.googleapis.com/auth/drive",
              ],
          )
          workbook = gspread.authorize(credentials).open_by_key(
              "1SsjWyqMsEW9yghahhuHCjDDtqlW2-56SbUWwmMXdig8"
          )
          tabs = [
              "Email Summary",
              "Game Email Summary",
              "Player Props Email Summary",
              "Best Card Email Summary",
          ]
          stale = {}
          for tab in tabs:
              values = workbook.worksheet(tab).get("A1:B15")
              summary = {
                  row[0]: row[1] if len(row) > 1 else ""
                  for row in values
                  if row and row[0]
              }
              actual = summary.get("Schedule Date Used", "")
              if actual != expected_text:
                  stale[tab] = actual or "missing"

          def records(tab):
              values = workbook.worksheet(tab).get_all_values()
              if not values:
                  return []
              headers = values[0]
              return [
                  {headers[i]: (row[i] if i < len(row) else "") for i in range(len(headers))}
                  for row in values[1:] if any(str(cell).strip() for cell in row)
              ]

          def pks(tab):
              result = set()
              for row in records(tab):
                  if str(row.get("Date", ""))[:10] != expected_text:
                      continue
                  raw = str(row.get("GamePk", "")).strip()
                  if raw:
                      result.add(raw)
              return result

          with urlopen(
              "https://statsapi.mlb.com/api/v1/schedule"
              f"?sportId=1&date={expected_text}",
              timeout=15,
          ) as response:
              schedule = json.load(response)
          official_count = sum(len(day.get("games", [])) for day in schedule.get("dates", []))
          required_stack_games = min(3, official_count)
          coverage = {
              "Game Picks": len(pks("Game Picks")),
              "HR": len(pks("Model Results")),
              "Player Props": len(pks("Player Props")),
          }
          incomplete = (
              coverage["Game Picks"] < required_stack_games
              or coverage["HR"] < required_stack_games
              or coverage["Player Props"] < required_stack_games
          )
          if stale or incomplete:
              raise SystemExit(
                  f"Refresh completed but slate validation failed. Expected {expected_text}; "
                  f"stale={stale}; official_games={official_count}; coverage={coverage}; "
                  f"required_stack_games={required_stack_games}"
              )
          print(
              f"Verified all four summaries and source coverage for {expected_text}: "
              f"official_games={official_count}, coverage={coverage}."
          )
          PY

      - name: Archive and grade published picks
        # Recovery is a no-op once all four summaries are current. Results tracking
        # has its own workflow, so do not let a redundant tracker call turn an
        # already-successful email day into a recovery failure notification.
        if: steps.early_slate.outputs.no_games != 'true' && steps.freshness.outputs.no_games == 'false' && steps.freshness.outputs.current != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python mlb_results_tracker.py --mode both
