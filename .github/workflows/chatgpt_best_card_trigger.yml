name: ChatGPT MLB Best Card Trigger

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-mlb-best-card
  cancel-in-progress: false

jobs:
  run-best-card:
    if: github.event.issue.title == 'RUN MLB BEST CARD'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check for MLB games today
        id: slate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          with urlopen(f"https://statsapi.mlb.com/api/v1/schedule?sportId=1&date={day}", timeout=15) as r:
              data = json.load(r)
          count = sum(len(d.get("games", [])) for d in data.get("dates", []))
          print(f"Official MLB games for {day}: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_games={'true' if count else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.slate.outputs.has_games == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Best Card dependencies
        if: steps.slate.outputs.has_games == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_player_props.txt -r requirements_best_card.txt

      - name: Verify production safeguards
        if: steps.slate.outputs.has_games == 'true'
        run: python -m unittest discover -s tests -v

      - name: Refresh Player Props data for Best Card
        if: steps.slate.outputs.has_games == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python run_daily_mlb_player_props.py

      - name: Run Best Card Model
        if: steps.slate.outputs.has_games == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python run_daily_mlb_best_card.py

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue close "$ISSUE_URL" --comment "Best Card trigger processed. Check this workflow run for the result."
