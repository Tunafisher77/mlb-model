name: MLB Results Tracking

on:
  schedule:
    # Grade yesterday early; later runs retry and snapshot today's picks.
    - cron: "15 7 * * *"
    - cron: "15 11 * * *"
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot, grade, or both"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - snapshot
          - grade
      tracking_date:
        description: "Optional snapshot date in YYYY-MM-DD"
        required: false
        type: string

jobs:
  archive-and-grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify frozen production models
        run: python -m unittest discover -s tests -v

      - name: Archive and grade published picks
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TRACKER_MODE: ${{ inputs.mode || 'both' }}
          TRACKER_DATE: ${{ inputs.tracking_date || '' }}
        run: |
          args=(--mode "$TRACKER_MODE")
          # Early scheduled runs grade archived picks without requiring today's
          # model summaries, which may still contain yesterday's slate.
          if [ "${{ github.event_name }}" = "schedule" ] && \
             { [ "${{ github.event.schedule }}" = "15 7 * * *" ] || [ "${{ github.event.schedule }}" = "15 11 * * *" ] || [ "${{ github.event.schedule }}" = "15 12 * * *" ]; }; then
            args=(--mode grade)
          fi
          if [ -n "$TRACKER_DATE" ]; then
            args+=(--date "$TRACKER_DATE")
          fi
          python mlb_results_tracker.py "${args[@]}"
