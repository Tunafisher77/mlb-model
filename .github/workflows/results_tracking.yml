name: MLB Results Tracking

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/results_tracking.yml"
  schedule:
    # Grade yesterday early; later runs retry and snapshot today's picks.
    - cron: "15 13 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot, grade, or both"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - snapshot
          - grade
      tracking_date:
        description: "Optional snapshot date in YYYY-MM-DD"
        required: false
        type: string

jobs:
  archive-and-grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check for MLB games today
        id: mlb_slate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          from datetime import timedelta
          day = (now.date() + timedelta(days=1) if now.hour >= 18 else now.date()).isoformat()
          with urlopen(f"https://statsapi.mlb.com/api/v1/schedule?sportId=1&date={day}", timeout=15) as r:
              data = json.load(r)
          count = sum(len(d.get("games", [])) for d in data.get("dates", []))
          print(f"Official MLB games for {day}: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_games={'true' if count else 'false'}\n")
          PY
      - name: Setup Python
        if: steps.mlb_slate.outputs.has_games == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        if: steps.mlb_slate.outputs.has_games == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify frozen production models
        if: steps.mlb_slate.outputs.has_games == 'true'
        run: python -m unittest discover -s tests -v

      - name: Archive and grade published picks
        if: steps.mlb_slate.outputs.has_games == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TRACKER_MODE: ${{ inputs.mode || 'grade' }}
          TRACKER_DATE: ${{ inputs.tracking_date || '' }}
        run: |
          args=(--mode "$TRACKER_MODE")
          # Scheduled tracking grades archived picks only; snapshots are taken
          # by recovery after the source models are confirmed fresh.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args=(--mode grade)
          fi
          if [ -n "$TRACKER_DATE" ]; then
            args+=(--date "$TRACKER_DATE")
          fi
          python mlb_results_tracker.py "${args[@]}"
