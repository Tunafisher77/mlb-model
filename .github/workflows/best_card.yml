name: Daily MLB Best Card

on:
  schedule:
    # Run after the three source models; retain later backups.
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      best_card_date:
        description: "Optional source date in YYYY-MM-DD"
        required: false
        type: string

jobs:
  run-best-card-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_best_card.txt

      - name: Skip delayed backup when today's card is already current
        id: freshness
        if: github.event_name == 'schedule'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import gspread
          from google.oauth2.service_account import Credentials

          now = datetime.now(ZoneInfo("America/New_York"))
          expected = now.date() + timedelta(days=1) if now.hour >= 18 else now.date()
          expected_text = expected.isoformat()
          credentials = Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=[
                  "https://www.googleapis.com/auth/spreadsheets",
                  "https://www.googleapis.com/auth/drive",
              ],
          )

          actual = ""
          checked = False
          for attempt in range(1, 6):
              try:
                  workbook = gspread.authorize(credentials).open_by_key(
                      "1SsjWyqMsEW9yghahhuHCjDDtqlW2-56SbUWwmMXdig8"
                  )
                  values = workbook.worksheet("Best Card Email Summary").get("A1:B15")
                  summary = {
                      row[0]: row[1] if len(row) > 1 else ""
                      for row in values
                      if row and row[0]
                  }
                  actual = summary.get("Schedule Date Used", "")
                  checked = True
                  break
              except Exception as exc:
                  if "429" not in str(exc) or attempt == 5:
                      print(f"Freshness check unavailable: {exc}")
                      break
                  delay = attempt * 20
                  print(f"Sheets quota busy; retrying freshness check in {delay}s.")
                  time.sleep(delay)

          # The recovery workflow independently rebuilds stale cards. If a delayed
          # backup cannot check freshness because Sheets is busy, finish quietly
          # instead of creating a false-alarm failure email.
          current = checked and actual == expected_text
          quiet_skip = not checked
          skip = current or quiet_skip
          print(f"Expected Best Card date: {expected_text}")
          print(f"Current Best Card date: {actual or 'unavailable'}")
          print(f"Skip redundant scheduled run: {skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"current={'true' if skip else 'false'}\n")
          PY

      - name: Verify all model safeguards
        if: github.event_name != 'schedule' || steps.freshness.outputs.current != 'true'
        run: python -m unittest discover -s tests -v

      - name: Run Best Card Model
        if: github.event_name != 'schedule' || steps.freshness.outputs.current != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MLB_SCHEDULE_DATE: ${{ inputs.best_card_date || '' }}
        run: python run_daily_mlb_best_card.py
